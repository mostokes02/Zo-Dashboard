<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
<head>
    <title>Setup Example</title>
    <script src="C:\AAA_Personal\mo\career\_training\_knockoutJS\knockout-3.5.1.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    
    <script>
        $(function (){
            var myViewModel = {
                course: "Knockout In Depth",
                rating: 10
            };
            ko.applyBindings(myViewModel);
        });
        
    </script>

</head>
<body>
    <div id="withBinding">
        The course <span data-bind="text: course"></span> got a rating of 
        <span data-bind="text: rating"></span>.
    </div>


</body>
</html>

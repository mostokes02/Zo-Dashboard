<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
<head>
    <title>Setup Example</title>
    <script src="C:\AAA_Personal\mo\career\_training\_knockoutJS\knockout-3.5.1.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js" integrity="sha256-o88AwQnZB+VDvE9tvIXrMQaPlFFSUTR+nldQm1LuPXQ=" crossorigin="anonymous"></script>
    <script>
        $(function (){
            var myViewModel = function(price, quantity) {
                self = this;
                self.itemPrice = ko.observable(price);
                self.quantity = ko.observable(quantity);
                self.totalPrice = ko.computed({
                    read: function(){
                        return "$" + (self.itemPrice() * self.quantity()).toFixed(2);
                    },
                    write: function(value){
                        value = parseFloat(value.replace("/[^\.d]/g", ""));
                        value = isNaN(value) ? 0 : value;
                        var tempPrice = value / self.quantity();
                        self.itemPrice(tempPrice);
                    },
                    owner: self
                });
            };
            ko.applyBindings(new myViewModel(15.00, 5));
        });
    </script>

</head>
<body>
    <p>Price: <input data-bind="value: itemPrice" /></p>
    <p>Quantity: <input data-bind="value: quantity" /></p>
    <p>Total Price: <input data-bind="value: totalPrice" /></p>
</body>
</html>
